<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OUTCOMES: data sources and field mapping</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- When the OUTCOMES shell shows this page inside itself (?embedded=1), its own title and note are hidden, since the shell already has them. -->
    <style>.embedded header>h1,.embedded header>p.note:first-of-type{display:none}.embedded header,.embedded main{max-width:none;padding:8px 12px}</style>
    <script>if (location.search.indexOf("embedded=1") >= 0) document.documentElement.classList.add("embedded");</script>
  </head>
  <body>
    <!-- Page shell. The file pickers stay here so choosing a file is never lost when the page redraws. -->
    <header>
      <h1>OUTCOMES <span>Module 1: data sources and field mapping</span></h1>
      <p class="note">Files are read in your browser only. Nothing is uploaded to a server.</p>
      <div class="pickers">
        <label>Upload file (CSV)<input type="file" id="gifts" accept=".csv" /></label>
        <button id="template" type="button">Download template</button>
        <button id="demo-sf" type="button">Demo: Salesforce sample</button>
        <button id="demo-gen" type="button">Demo: another organisation's file</button>
      </div>
      <!-- Read-only Google sign-in. People see only the sheets that are shared with their own Google account. -->
      <div class="pickers">
        <label>Google Sheet link<input type="text" id="sheetlink" size="44" placeholder="https://docs.google.com/spreadsheets/d/..." /></label>
        <label>Tab name<input type="text" id="sheettab" size="14" placeholder="First tab" /></label>
        <button id="gload" type="button">Load from Google Sheet</button>
        <button id="gsign" type="button">Sign in with Google</button>
      </div>
      <div id="status" class="status"></div>
      <!-- Configuration is set once and kept in this browser, so only the Upload file is chosen each time. -->
      <details class="cfg" id="cfg">
        <summary>Configuration (set once)</summary>
        <p id="cfgstatus" class="note"></p>
        <div class="pickers">
          <label>Source type<select id="preset"></select></label>
          <label>How lines are laid out<select id="layout">
            <option value="lines-column">One row per transaction, lines in one column</option>
            <option value="one-row-per-line">One row per line, rows with the same reference are one transaction</option>
            <option value="one-line-per-transaction">One row per transaction, one line</option>
          </select></label>
          <label class="check"><input type="checkbox" id="feedbackonly" /> The upload holds only some lines of each transaction</label>
        </div>
        <div class="pickers">
          <label>Lookup lists (optional, names for fund and outcome IDs)<input type="file" id="meta" accept=".csv" /></label>
          <label>Saved setup (optional)<input type="file" id="setupfile" accept=".json" /></label>
          <label>Google client ID<input type="text" id="gclient" size="40" placeholder="Only needed once, see docs/GOOGLE-SETUP.md" /></label>
          <button id="forget" type="button">Forget saved setup</button>
        </div>
      </details>
    </header>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
