<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OUTCOMES: data sources and field mapping</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Page shell. The file pickers stay here so choosing a file is never lost when the page redraws. -->
    <header>
      <h1>OUTCOMES <span>Module 1: data sources and field mapping</span></h1>
      <p class="note">Files are read in your browser only. Nothing is uploaded to a server.</p>
      <div class="pickers">
        <label>Upload file (CSV)<input type="file" id="gifts" accept=".csv" /></label>
        <button id="template" type="button">Download template</button>
      </div>
      <!-- Read-only Google sign-in. People see only the sheets that are shared with their own Google account. -->
      <div class="pickers">
        <label>Google Sheet link<input type="text" id="sheetlink" size="44" placeholder="https://docs.google.com/spreadsheets/d/..." /></label>
        <label>Tab name<input type="text" id="sheettab" size="14" value="SF Upload" /></label>
        <button id="gload" type="button">Load from Google Sheet</button>
        <button id="gsign" type="button">Sign in with Google</button>
      </div>
      <div id="status" class="status"></div>
      <!-- Configuration is set once and kept in this browser, so only the Upload file is chosen each time. -->
      <details class="cfg" id="cfg">
        <summary>Configuration (set once)</summary>
        <p id="cfgstatus" class="note"></p>
        <div class="pickers">
          <label>Code book (CSV)<input type="file" id="meta" accept=".csv" /></label>
          <label>Saved setup (optional)<input type="file" id="setupfile" accept=".json" /></label>
          <label>Google client ID<input type="text" id="gclient" size="40" placeholder="Only needed once, see docs/GOOGLE-SETUP.md" /></label>
          <button id="forget" type="button">Forget saved setup</button>
        </div>
      </details>
    </header>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
